[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cordglean"
version = "0.1.0"
description = "full-fidelity Discord context for agents"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "cordglean contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.27,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
cordglean = "cordglean.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cordglean"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
