name: Deploy

# The heavy stage (operator decision 2026-11-07,
# hk:doc decision/2026-11-07/fleet-ci-three-tiers-r2 §1, §4-2): the full -race
# suite, the deploy target platform (macOS, because the release ships darwin
# binaries), the four release artifacts and a test-install smoke. It starts only
# from a successful main-stage run for that run's head sha, is never cancelled,
# and posts the commit status deploy-ok as candidate evidence.
#
# cordglean has no database and no schema, so there is no migration path and no
# deployed-schema step. There are no regression mutants.
#
# Manual/any-ref paths (r2 §4-4; the repo has no ci-any-ref.yml): the
# workflow_dispatch `ref` input runs the stage on any ref, and workflow_call is
# the pre-merge path from checks.yml's manual entry (GitHub only accepts a
# workflow_dispatch event for a workflow file that exists on the default
# branch). Both still post deploy-ok on that sha. Nothing here publishes, tags,
# pushes or deploys: the built assets are uploaded as a run-scoped evidence
# artifact only.
on:
  workflow_run:
    workflows: ["CI main"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Exact ref or sha to run the deploy stage on (empty means this dispatch's ref)
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      ref:
        description: Exact ref or sha to run the deploy stage on (empty means the caller's ref)
        required: false
        default: ''
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  # Never cancel a deploy: a cancelled run proves nothing and would leave a
  # half-written verdict. One deploy per repository; GitHub keeps only the
  # newest pending entry, so a newer head replaces an older queued one (r2 §1).
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  candidate:
    # Only a successful main-stage run, for the sha it ran on; or a manual
    # run on any ref.
    if: ${{ github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      policy: ${{ steps.policy.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}
          persist-credentials: false
      - name: Resolve the candidate sha
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Read the policy revision
        id: policy
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' .mergewake/policy.yaml)
          hash=$(sha256sum .mergewake/policy.yaml | cut -d' ' -f1)
          echo "revision=v${version}@${hash:0:12}" >> "$GITHUB_OUTPUT"

  race:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # The full suite under the race detector. No changed-path filter.
      - name: go test -race, full suite
        run: go test -race ./...

  macos:
    needs: candidate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # The deploy target platform: the release ships darwin/amd64 and
      # darwin/arm64 binaries, so the suite runs on macOS too.
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  release:
    needs: candidate
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # The same script release.yml runs, with a dry-run tag (v0.0.0-* is never
      # published). It builds linux/darwin × amd64/arm64 plus SHA256SUMS.
      - name: Build the four release artifacts
        run: sh scripts/build-release.sh "v0.0.0-deploy.$GITHUB_RUN_ID" dist/release
      - name: Verify assets, SHA256SUMS and version output
        run: sh scripts/verify-release.sh "v0.0.0-deploy.$GITHUB_RUN_ID" dist/release
      - name: Test-install smoke
        run: ./dist/release/cordglean-linux-amd64 --version
      - name: Digest the artifact set
        id: digest
        run: echo "digest=$(sha256sum dist/release/SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # Run-scoped evidence, not a release: nothing here publishes or tags.
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-release-assets
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  deploy-ok:
    name: deploy-ok
    needs: [candidate, race, macos, release]
    # The verdict is always posted, including on a failure, so the sha is never
    # left looking green by a missing status. If the sha could not be resolved
    # there is nothing to post to; a missing status reads as unknown.
    if: ${{ always() && needs.candidate.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Post deploy-ok commit status with candidate evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ needs.candidate.outputs.sha }}
          POLICY_REVISION: ${{ needs.candidate.outputs.policy }}
          ARTIFACT_DIGEST: ${{ needs.release.outputs.digest }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RACE_RESULT: ${{ needs.race.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          state=success result=success
          for r in "$RACE_RESULT" "$MACOS_RESULT" "$RELEASE_RESULT"; do
            case "$r" in
              success) ;;
              cancelled) [ "$state" = failure ] || state=error ;;
              *) state=failure ;;
            esac
          done
          if [ "$state" = error ]; then result=cancelled
          elif [ "$state" = failure ]; then result=failure
          fi
          short_sha=${TARGET_SHA:0:12}
          short_digest=${ARTIFACT_DIGEST:0:16}
          description="repo=$REPO sha=$short_sha policy=$POLICY_REVISION suite=deploy env=github-hosted run=$RUN_ID $result digest=$short_digest"
          if [ "${#description}" -gt 140 ]; then
            echo "deploy-ok description is ${#description} characters, over the 140 limit" >&2; exit 1
          fi
          {
            echo "## deploy-ok candidate evidence"
            echo
            echo "| field | value |"
            echo "|---|---|"
            echo "| repo | \`$REPO\` |"
            echo "| sha | \`$TARGET_SHA\` |"
            echo "| policy_revision | \`$POLICY_REVISION\` |"
            echo "| suite | race, macos, release, install-smoke |"
            echo "| environment | github-hosted |"
            echo "| run_id | \`$RUN_ID\` |"
            echo "| result | $result |"
            echo "| artifact digest | \`$ARTIFACT_DIGEST\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/${REPO}/statuses/${TARGET_SHA}" \
            -f state="$state" \
            -f context=deploy-ok \
            -f target_url="$RUN_URL" \
            -f description="$description"
